[package]
name = "vacc-libva"
version = "0.1.0"
license = "BSD-3-Clause"
description = "Safe bindings over libva: vendored cros-libva with VAAPI-decoder fixes (zero-initialized decode parameter buffers, HEVC extension buffer wrappers)"
repository.workspace = true
authors = ["The Chromium OS Authors", "Andrey Tkachenko"]
edition = "2021"

# The lib target keeps the upstream name so `use libva::...` is unchanged.
[lib]
name = "libva"

[features]
intel-protected-content-headers = []

[dependencies]
thiserror = "1"
bitflags = "2.5"
log = { version = "0", features = ["release_max_level_debug"] }

[build-dependencies]
bindgen = "0.70.1"
pkg-config = "0.3.31"
regex = "1.11.1"

[dev-dependencies]
crc32fast = "1.2.1"
