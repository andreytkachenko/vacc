[package]
name = "vacc-examples"
description = "Examples for vacc library"
license.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[[example]]
name = "decode"
path = "src/decode.rs"

# Each decode backend is a compile-time feature (all on by default).
# Build with a subset, e.g.:
#   cargo build -p vacc-examples --no-default-features --features "hevcjs vaapi"
[features]
default = ["edge264", "hevcjs", "nvdec", "vaapi", "vulkan"]
edge264 = ["dep:vacc-software-decode"]
hevcjs = ["dep:vacc-software-decode"]
nvdec = ["dep:vacc-nvdec-decode"]
vaapi = ["dep:vacc-vaapi-decode"]
vulkan = ["dep:vacc-vulkan-decode", "dep:vacc-vulkan"]

[dependencies]
vacc-core = { workspace = true }
vacc-vulkan = { workspace = true, optional = true }
vacc-nvdec-decode = { workspace = true, optional = true }
vacc-vaapi-decode = { workspace = true, optional = true }
vacc-software-decode = { workspace = true, optional = true }
vacc-vulkan-decode = { workspace = true, optional = true }
