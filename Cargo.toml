[workspace]
members = [
    "crates/vacc-core",
    "crates/vacc-parser",
    "crates/vacc-vulkan",
    "crates/nvdec-decode",
    "crates/vulkan-decode",
    "crates/vulkan-common",
    "crates/examples",
    "crates/vaapi-decode",
    "crates/libva",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vulkan Video Decoder library in Rust"
repository = "https://github.com/andreytkachenko/vacc"

[workspace.dependencies]
vacc-core = { path = "crates/vacc-core", version = "0.1.0" }
vacc-vulkan = { path = "crates/vacc-vulkan", version = "0.1.0" }
vacc-parser = { path = "crates/vacc-parser", version = "0.1.0" }
nvdec-decode = { path = "crates/nvdec-decode", version = "0.1.0" }
vaapi-decode = { path = "crates/vaapi-decode", version = "0.1.0" }
vulkan-decode = { path = "crates/vulkan-decode", version = "0.1.0" }
vulkan-common = { path = "crates/vulkan-common", version = "0.1.0" }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
thiserror = "2"
log = "0.4"
tracing = "0.1"
libloading = "0.8"
