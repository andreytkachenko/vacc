[package]
name = "vacc"
description = "Vacc video decoder: unified API over Vulkan, NVDEC, VAAPI and software backends with automatic fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Ship only the library; keep the repo's test assets, samples and dev scripts
# out of the published crate (assets/ alone is ~134MB).
exclude = [
    "assets/**",
    "*.py",
    "issues.md",
]

# Each GPU backend is a compile-time feature (all on by default); a backend
# feature enables both its decode and encode crates. Build with a subset,
# e.g.:
#   cargo build -p vacc --no-default-features --features "vaapi sw"
[features]
default = ["vulkan", "nvdec", "vaapi", "sw"]
vulkan = ["dep:vacc-vulkan-decode", "dep:vacc-vulkan-encode"]
# NVDEC device-resident frames need NPP for GPU transforms + readback.
nvdec = ["dep:vacc-nvdec-decode", "dep:vacc-nvenc-encode", "npp"]
# NVIDIA Performance Primitives image pipeline. Links libcuda, so it is
# opt-in: CPU-only consumers build without it and stay driver-free.
npp = ["dep:vacc-npp"]
vaapi = ["dep:vacc-vaapi-decode", "dep:vacc-vaapi-encode"]
sw = ["dep:vacc-software-decode", "dep:vacc-software-encode"]

[dependencies]
vacc-core = { workspace = true }
vacc-image = { workspace = true }
vacc-npp = { workspace = true, optional = true }
vacc-vkimage = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
vacc-vulkan-decode = { workspace = true, optional = true }
vacc-nvdec-decode = { workspace = true, optional = true }
vacc-vaapi-decode = { workspace = true, optional = true }
vacc-software-decode = { workspace = true, optional = true }
vacc-software-encode = { workspace = true, optional = true }
vacc-vulkan-encode = { workspace = true, optional = true }
vacc-nvenc-encode = { workspace = true, optional = true }
vacc-vaapi-encode = { workspace = true, optional = true }

[workspace]
members = [
    "crates/vacc-core",
    "crates/vacc-common",
    "crates/vacc-image",
    "crates/vacc-parser",
    "crates/vacc-vulkan",
    "crates/vacc-nvdec-decode",
    "crates/vacc-vulkan-decode",
    "crates/vacc-examples",
    "crates/vacc-vaapi-decode",
    "crates/vacc-vaapi-encode",
    "crates/vacc-nvenc-encode",
    "crates/vacc-vulkan-encode",
    "crates/vacc-software-decode",
    "crates/vacc-software-encode",
    "crates/vacc-golden-tests",
    "crates/vacc-npp",
    "crates/vacc-vkimage",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vulkan Video Decoder library in Rust"
repository = "https://github.com/andreytkachenko/vacc"

[workspace.dependencies]
vacc-core = { path = "crates/vacc-core", version = "0.1.2" }
vacc-common = { path = "crates/vacc-common", version = "0.1.2" }
vacc-image = { path = "crates/vacc-image", version = "0.1.2" }
vacc-npp = { path = "crates/vacc-npp", version = "0.1.2" }
vacc-vkimage = { path = "crates/vacc-vkimage", version = "0.1.2" }
vacc-vulkan = { path = "crates/vacc-vulkan", version = "0.1.2" }
vacc-parser = { path = "crates/vacc-parser", version = "0.1.2" }
vacc-nvdec-decode = { path = "crates/vacc-nvdec-decode", version = "0.1.2" }
vacc-vaapi-decode = { path = "crates/vacc-vaapi-decode", version = "0.1.2" }
vacc-vaapi-encode = { path = "crates/vacc-vaapi-encode", version = "0.1.2" }
vacc-nvenc-encode = { path = "crates/vacc-nvenc-encode", version = "0.1.2" }
vacc-vulkan-encode = { path = "crates/vacc-vulkan-encode", version = "0.1.2" }
vacc-software-decode = { path = "crates/vacc-software-decode", version = "0.1.2" }
vacc-software-encode = { path = "crates/vacc-software-encode", version = "0.1.2" }
vacc-golden-tests = { path = "crates/vacc-golden-tests", version = "0.1.2" }
vacc-vulkan-decode = { path = "crates/vacc-vulkan-decode", version = "0.1.2" }
# Interim cros-libva fork with VAAPI-decoder fixes, published as vacc-libva
# until the fixes merge upstream (then switch back to cros-libva). The lib
# target keeps the name `libva`, so code is unchanged.
libva = { package = "vacc-libva", version = "0.1.0" }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
bitflags = "2"
thiserror = "2"
log = "0.4"
tracing = "0.1"
libloading = "0.8"
