[package]
name = "vacc"
description = "Vacc video decoder: unified API over Vulkan, NVDEC, VAAPI and software backends with automatic fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Each decode backend is a compile-time feature (all on by default). Build
# with a subset, e.g.:
#   cargo build -p vacc --no-default-features --features "vaapi sw"
[features]
default = ["vulkan", "nvdec", "vaapi", "sw"]
vulkan = ["dep:vacc-vulkan-decode"]
nvdec = ["dep:vacc-nvdec-decode"]
vaapi = ["dep:vacc-vaapi-decode"]
sw = ["dep:vacc-software-decode"]

[dependencies]
vacc-core = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
vacc-vulkan-decode = { workspace = true, optional = true }
vacc-nvdec-decode = { workspace = true, optional = true }
vacc-vaapi-decode = { workspace = true, optional = true }
vacc-software-decode = { workspace = true, optional = true }

[workspace]
members = [
    "crates/vacc-core",
    "crates/vacc-common",
    "crates/vacc-parser",
    "crates/vacc-vulkan",
    "crates/vacc-nvdec-decode",
    "crates/vacc-vulkan-decode",
    "crates/vacc-vulkan-common",
    "crates/vacc-examples",
    "crates/vacc-vaapi-decode",
    "crates/vacc-software-decode",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vulkan Video Decoder library in Rust"
repository = "https://github.com/andreytkachenko/vacc"

[workspace.dependencies]
vacc-core = { path = "crates/vacc-core", version = "0.1.1" }
vacc-common = { path = "crates/vacc-common", version = "0.1.1" }
vacc-vulkan = { path = "crates/vacc-vulkan", version = "0.1.1" }
vacc-parser = { path = "crates/vacc-parser", version = "0.1.1" }
vacc-nvdec-decode = { path = "crates/vacc-nvdec-decode", version = "0.1.1" }
vacc-vaapi-decode = { path = "crates/vacc-vaapi-decode", version = "0.1.1" }
vacc-software-decode = { path = "crates/vacc-software-decode", version = "0.1.1" }
vacc-vulkan-decode = { path = "crates/vacc-vulkan-decode", version = "0.1.1" }
vacc-vulkan-common = { path = "crates/vacc-vulkan-common", version = "0.1.1" }
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
bitflags = "2"
thiserror = "2"
log = "0.4"
tracing = "0.1"
libloading = "0.8"
